upstream openagentx_daemon {
    server rtx4090:18100;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name openagentx.tailnet;

    ssl_certificate     /var/lib/tailscale/certs/openagentx.tailnet.crt;
    ssl_certificate_key /var/lib/tailscale/certs/openagentx.tailnet.key;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/observe/v1/events/stream {
        proxy_pass http://openagentx_daemon;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://openagentx_daemon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_cache off;
    }
}
